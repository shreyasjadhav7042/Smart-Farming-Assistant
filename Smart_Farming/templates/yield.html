<!DOCTYPE html>
<html>

<head>

    <title>Yield Prediction</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <nav>

        <h2>Smart Farming</h2>

        <div>
            <a href="/">Home</a>
            <a href="/crop">Crop Recommendation</a>
            <a href="/yield">Yield Prediction</a>
        </div>

    </nav>


    <div class="crop-page">

        <div class="crop-intro">

            <p class="tag">SMART AGRICULTURE</p>

            <h1>Yield Prediction</h1>

            <p>
                Enter agricultural and environmental conditions
                to predict crop yield.
            </p>

        </div>


        <div class="crop-card">

            <form action="/predict_yield" method="POST">

                <div class="crop-form">


                    <div class="field">

                        <label>Crop</label>

                        <select name="crop" required>

                            <option value="">Select Crop</option>

                            <option>Arecanut</option>
                            <option>Arhar/Tur</option>
                            <option>Bajra</option>
                            <option>Banana</option>
                            <option>Barley</option>
                            <option>Black pepper</option>
                            <option>Cardamom</option>
                            <option>Cashewnut</option>
                            <option>Castor seed</option>
                            <option>Coconut</option>
                            <option>Coriander</option>
                            <option>Cotton(lint)</option>
                            <option>Cowpea(Lobia)</option>
                            <option>Dry chillies</option>
                            <option>Garlic</option>
                            <option>Ginger</option>
                            <option>Gram</option>
                            <option>Groundnut</option>
                            <option>Guar seed</option>
                            <option>Horse-gram</option>
                            <option>Jowar</option>
                            <option>Jute</option>
                            <option>Khesari</option>
                            <option>Linseed</option>
                            <option>Maize</option>
                            <option>Masoor</option>
                            <option>Mesta</option>
                            <option>Moong(Green Gram)</option>
                            <option>Moth</option>
                            <option>Niger seed</option>
                            <option>Oilseeds total</option>
                            <option>Onion</option>
                            <option>Other Rabi pulses</option>
                            <option>Other Cereals</option>
                            <option>Other Kharif pulses</option>
                            <option>Other Summer Pulses</option>
                            <option>Peas & beans (Pulses)</option>
                            <option>Potato</option>
                            <option>Ragi</option>
                            <option>Rapeseed &Mustard</option>
                            <option>Rice</option>
                            <option>Safflower</option>
                            <option>Sannhamp</option>
                            <option>Sesamum</option>
                            <option>Small millets</option>
                            <option>Soyabean</option>
                            <option>Sugarcane</option>
                            <option>Sunflower</option>
                            <option>Sweet potato</option>
                            <option>Tapioca</option>
                            <option>Tobacco</option>
                            <option>Turmeric</option>
                            <option>Urad</option>
                            <option>Wheat</option>
                            <option>other oilseeds</option>

                        </select>

                    </div>


                    <div class="field">

                        <label>State</label>

                        <select name="state" required>

                            <option value="">Select State</option>

                            <option>Andhra Pradesh</option>
                            <option>Arunachal Pradesh</option>
                            <option>Assam</option>
                            <option>Bihar</option>
                            <option>Chhattisgarh</option>
                            <option>Delhi</option>
                            <option>Goa</option>
                            <option>Gujarat</option>
                            <option>Haryana</option>
                            <option>Himachal Pradesh</option>
                            <option>Jammu and Kashmir</option>
                            <option>Jharkhand</option>
                            <option>Karnataka</option>
                            <option>Kerala</option>
                            <option>Madhya Pradesh</option>
                            <option>Maharashtra</option>
                            <option>Manipur</option>
                            <option>Meghalaya</option>
                            <option>Mizoram</option>
                            <option>Nagaland</option>
                            <option>Odisha</option>
                            <option>Puducherry</option>
                            <option>Punjab</option>
                            <option>Sikkim</option>
                            <option>Tamil Nadu</option>
                            <option>Telangana</option>
                            <option>Tripura</option>
                            <option>Uttar Pradesh</option>
                            <option>Uttarakhand</option>
                            <option>West Bengal</option>

                        </select>

                    </div>


                    <div class="field">

                        <label>Season</label>

                        <select name="season" required>

                            <option value="">Select Season</option>

                            <option>Autumn</option>
                            <option>Kharif</option>
                            <option>Rabi</option>
                            <option>Summer</option>
                            <option>Whole Year</option>
                            <option>Winter</option>

                        </select>

                    </div>


                    <div class="field">

                        <label>Crop Year</label>

                        <input type="number"
                               name="crop_year"
                               placeholder="e.g. 2020"
                               required>

                    </div>


                    <div class="field">

                        <label>Area</label>

                        <input type="number"
                               step="any"
                               name="area"
                               placeholder="Area"
                               required>

                    </div>


                    <div class="field">

                        <label>Annual Rainfall</label>

                        <input type="number"
                               step="any"
                               name="rainfall"
                               placeholder="mm"
                               required>

                    </div>


                    <div class="field">

                        <label>Fertilizer</label>

                        <input type="number"
                               step="any"
                               name="fertilizer"
                               placeholder="Fertilizer"
                               required>

                    </div>


                    <div class="field">

                        <label>Pesticide</label>

                        <input type="number"
                               step="any"
                               name="pesticide"
                               placeholder="Pesticide"
                               required>

                    </div>


                    <div class="field">

                        <label>Average Temperature</label>

                        <input type="number"
                               step="any"
                               name="avg_temperature"
                               placeholder="°C"
                               required>

                    </div>


                    <div class="field">

                        <label>Maximum Temperature</label>

                        <input type="number"
                               step="any"
                               name="max_temperature"
                               placeholder="°C"
                               required>

                    </div>


                    <div class="field">

                        <label>Minimum Temperature</label>

                        <input type="number"
                               step="any"
                               name="min_temperature"
                               placeholder="°C"
                               required>

                    </div>

                </div>


                <button type="submit">
                    Predict Yield
                </button>

            </form>


            {% if prediction %}

            <div class="result">

                <p>Predicted Yield</p>

                <h2>{{ prediction }}</h2>

            </div>

            {% endif %}


        </div>

    </div>

</body>

</html>
